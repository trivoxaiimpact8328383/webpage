
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>CEZOO Payment</title>

<link
  href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:#f4f8f5;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.payment-card{
  width:100%;
  max-width:400px;
  background:white;
  padding:30px 24px;
  border-radius:24px;
  box-shadow:0 12px 45px rgba(0,0,0,.06);
  text-align:center;
}

.logo{
  font-family:Bungee,sans-serif;
  font-size:38px;
  color:#087f5b;
}

.tagline{
  font-size:12px;
  color:#777;
  margin-top:3px;
}

.title{
  font-size:21px;
  font-weight:800;
  margin-top:30px;
}

.subtitle{
  color:#777;
  font-size:13px;
  margin-top:9px;
  line-height:1.6;
}

.amount-box{
  margin-top:25px;
  background:#effaf3;
  border:1px solid #d5eddf;
  border-radius:18px;
  padding:23px;
}

.amount-label{
  font-size:13px;
  color:#65766b;
}

.amount-input-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:12px;
}

.rupee{
  font-size:36px;
  font-weight:800;
  color:#087f5b;
}

.amount-input{
  width:180px;
  border:0;
  outline:0;
  background:transparent;
  font-family:Inter,sans-serif;
  font-size:42px;
  font-weight:800;
  color:#087f5b;
  text-align:center;
}

.amount-input::placeholder{
  color:#b5d8c4;
}

.amount-input::-webkit-inner-spin-button,
.amount-input::-webkit-outer-spin-button{
  -webkit-appearance:none;
  margin:0;
}

.quick-amounts{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
  margin-top:20px;
}

.quick-amounts button{
  border:1px solid #d9e9df;
  background:white;
  padding:10px 15px;
  border-radius:10px;
  font-family:Inter,sans-serif;
  font-size:13px;
  font-weight:700;
  color:#087f5b;
  cursor:pointer;
}

.quick-amounts button.active{
  background:#087f5b;
  color:white;
}

.pay-btn{
  width:100%;
  height:55px;
  margin-top:26px;
  background:#087f5b;
  border:0;
  border-radius:14px;
  color:white;
  font-family:Inter,sans-serif;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.pay-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.secure{
  font-size:12px;
  color:#888;
  margin-top:18px;
}

.success-box{
  display:none;
  margin-top:28px;
  padding:25px 15px;
  background:#effaf3;
  border-radius:18px;
}

.success-icon{
  width:70px;
  height:70px;
  background:#087f5b;
  color:white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  margin:0 auto 16px;
}

.success-title{
  font-size:22px;
  font-weight:800;
  color:#087f5b;
}

.success-amount{
  font-size:28px;
  font-weight:800;
  margin-top:13px;
}

.success-note{
  font-size:13px;
  color:#555;
  margin-top:8px;
}

.transaction{
  margin-top:20px;
  font-size:11px;
  color:#666;
  overflow-wrap:anywhere;
  line-height:1.9;
  white-space:pre-line;
}

.status{
  margin-top:18px;
  font-size:13px;
  color:#b45309;
  line-height:1.6;
}

</style>

</head>

<body>

<div class="payment-card">

  <div class="logo">
    CEZOO
  </div>

  <div class="tagline">
    Groceries in Minutes
  </div>

  <div id="paymentSection">

    <div class="title">
      Complete Your Payment
    </div>

    <div class="subtitle">
      Enter the amount you want to pay
    </div>

    <div class="amount-box">

      <div class="amount-label">
        Enter Amount
      </div>

      <div class="amount-input-wrap">

        <span class="rupee">
          ₹
        </span>

        <input
          type="number"
          id="amountInput"
          class="amount-input"
          value="1"
          min="1"
          max="1000000"
          step="0.01"
          inputmode="decimal"
          oninput="updateAmount()"
        >

      </div>

    </div>

    <div class="quick-amounts">

      <button onclick="setAmount(1)">
        ₹1
      </button>

      <button onclick="setAmount(100)">
        ₹100
      </button>

      <button onclick="setAmount(200)">
        ₹200
      </button>

      <button onclick="setAmount(500)">
        ₹500
      </button>

    </div>

    <button
      id="payButton"
      class="pay-btn"
      onclick="startPayment()"
    >
      Pay ₹1.00
    </button>

    <div class="secure">
      Secure payment powered by Razorpay
    </div>

  </div>

  <div
    id="successBox"
    class="success-box"
  >

    <div class="success-icon">
      ✓
    </div>

    <div class="success-title">
      Payment Successful!
    </div>

    <div
      class="success-amount"
      id="successAmount"
    ></div>

    <div class="success-note">
      Your payment has been received
    </div>

    <div
      class="transaction"
      id="transactionDetails"
    ></div>

  </div>

  <div
    class="status"
    id="statusMessage"
    role="status"
  ></div>

</div>

<script>

/* =====================================
   CONFIGURATION
===================================== */

const API =
  "https://payment-czhd.onrender.com";

const RAZORPAY_KEY =
  "rzp_live_TdnkHC6KB6wZYP";

const amountInput =
  document.getElementById(
    "amountInput"
  );

const payButton =
  document.getElementById(
    "payButton"
  );

const statusMessage =
  document.getElementById(
    "statusMessage"
  );

let paymentStarted = false;

/* =====================================
   FORMAT AMOUNT
===================================== */

function formatAmount(value){

  return Number(value).toLocaleString(
    "en-IN",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}

/* =====================================
   SET AMOUNT
===================================== */

function setAmount(value){

  amountInput.value = value;

  updateAmount();

}

/* =====================================
   UPDATE PAYMENT BUTTON
===================================== */

function updateAmount(){

  const amount =
    Number(amountInput.value);

  if(
    !Number.isFinite(amount) ||
    amount < 1 ||
    amount > 1000000
  ){

    payButton.textContent =
      "Enter Valid Amount";

    payButton.disabled = true;

    return;

  }

  payButton.disabled =
    paymentStarted;

  payButton.textContent =
    "Pay ₹" + formatAmount(amount);

}

/* =====================================
   SHOW MESSAGE
===================================== */

function showMessage(message){

  statusMessage.textContent =
    message;

}

/* =====================================
   SUCCESS UI
===================================== */

function showSuccess(result){

  document.getElementById(
    "paymentSection"
  ).style.display = "none";

  document.getElementById(
    "successBox"
  ).style.display = "block";

  document.getElementById(
    "successAmount"
  ).textContent =
    "₹" + formatAmount(result.amount);

  document.getElementById(
    "transactionDetails"
  ).textContent =
    "Payment ID: " +
    result.payment_id +
    "\nOrder ID: " +
    result.order_id +
    "\nPayment Method: " +
    result.payment_method;

  showMessage("");

}

/* =====================================
   VERIFY PAYMENT
===================================== */

async function verifyPayment(response){

  showMessage(
    "Verifying your payment..."
  );

  const verifyResponse =
    await fetch(

      API +
      "/api/razorpay/verify",

      {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          razorpay_order_id:
            response.razorpay_order_id,

          razorpay_payment_id:
            response.razorpay_payment_id,

          razorpay_signature:
            response.razorpay_signature

        })

      }

    );

  const result =
    await verifyResponse.json();

  if(
    verifyResponse.ok &&
    result.success === true &&
    result.status === "captured"
  ){

    showSuccess(result);

    return;

  }

  showMessage(
    "Payment confirmation pending. " +
    "Please check your transaction " +
    "before paying again."
  );

}

/* =====================================
   START DYNAMIC PAYMENT
===================================== */

async function startPayment(){

  if(paymentStarted){
    return;
  }

  const amount =
    Number(amountInput.value);

  if(
    !Number.isFinite(amount) ||
    amount < 1 ||
    amount > 1000000 ||
    Math.abs(
      amount * 100 -
      Math.round(amount * 100)
    ) > 0.000001
  ){

    showMessage(
      "Enter a valid amount of at least ₹1, " +
      "with at most two decimal places."
    );

    return;

  }

  if(
    typeof Razorpay === "undefined"
  ){

    showMessage(
      "Razorpay could not load."
    );

    return;

  }

  paymentStarted = true;

  payButton.disabled = true;

  payButton.textContent =
    "Please wait...";

  showMessage("");

  try{

    /* CREATE ORDER */

    const response =
      await fetch(

        API +
        "/api/razorpay/create-order",

        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            amount: amount,

            customer_name:
              "CEZOO Customer"

          })

        }

      );

    const order =
      await response.json();

    if(
      !response.ok ||
      !order.success
    ){

      throw new Error(
        order.message ||
        "Unable to create order"
      );

    }

    /* CHECK AMOUNT */

    if(
      order.amount !==
      Math.round(amount * 100) ||
      order.currency !== "INR" ||
      order.key !== RAZORPAY_KEY
    ){

      throw new Error(
        "Payment amount or key mismatch"
      );

    }

    /* RAZORPAY CHECKOUT */

    const options = {

      key:
        RAZORPAY_KEY,

      amount:
        order.amount,

      currency:
        "INR",

      name:
        "CEZOO",

      description:
        "CEZOO Payment",

      order_id:
        order.order_id,

      theme:{

        color:"#087f5b"

      },

      handler:async function(
        paymentResponse
      ){

        try{

          await verifyPayment(
            paymentResponse
          );

        }catch(error){

          console.error(error);

          showMessage(
            "Unable to confirm payment. " +
            "Please check Razorpay before retrying."
          );

        }

      },

      modal:{

        ondismiss:function(){

          paymentStarted = false;

          updateAmount();

        }

      }

    };

    const razorpay =
      new Razorpay(options);

    razorpay.on(

      "payment.failed",

      function(response){

        console.error(
          response.error
        );

        showMessage(
          "Payment failed. Please try again."
        );

        paymentStarted = false;

        updateAmount();

      }

    );

    razorpay.open();

  }catch(error){

    console.error(error);

    showMessage(
      error.message ||
      "Unable to start payment"
    );

    paymentStarted = false;

    updateAmount();

  }

}

updateAmount();

</script>

</body>
</html>
